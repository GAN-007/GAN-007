<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">GAN-TECH purple solar system with friendly green aliens and orbiting UFO</title>
<desc id="desc">Accessible futuristic purple nebula and glowing planet, with two friendly green aliens, a hovering spaceship, starfield, and George Alfred Nyamema engineering profile. Motion is decorative.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030712"/>
    <stop offset=".45" stop-color="#170d35"/>
    <stop offset="1" stop-color="#13072b"/>
  </linearGradient>
  <radialGradient id="orb" cx=".34" cy=".28" r=".72">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset=".18" stop-color="#8be9ff"/>
    <stop offset=".48" stop-color="#2f7cff"/>
    <stop offset=".78" stop-color="#5b21b6"/>
    <stop offset="1" stop-color="#15032e"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
    <stop offset=".5" stop-color="#93c5fd" stop-opacity=".08"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity=".18"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
  </filter>
  <radialGradient id="purpleNebula"><stop offset="0" stop-color="#9d4edd" stop-opacity=".42"/><stop offset=".66" stop-color="#7431c5" stop-opacity=".12"/><stop offset="1" stop-color="#7431c5" stop-opacity="0"/></radialGradient>
  <linearGradient id="ufoBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e9ff"/><stop offset=".48" stop-color="#9285db"/><stop offset="1" stop-color="#3e286f"/></linearGradient>
  <linearGradient id="alienSkin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ff9a"/><stop offset=".45" stop-color="#7bfb74"/><stop offset="1" stop-color="#28c56e"/></linearGradient>
  <radialGradient id="tractorBeam"><stop offset="0" stop-color="#6effb4" stop-opacity=".32"/><stop offset="1" stop-color="#6effb4" stop-opacity="0"/></radialGradient>
  <style>
    .ufo-hover{animation:ufo-drift 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .alien-float{animation:alien-bob 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .star-twinkle{animation:star-pulse 3.8s ease-in-out infinite}
    @keyframes ufo-drift{0%,100%{transform:translate(0px,0px) rotate(-5deg)}50%{transform:translate(13px,-12px) rotate(4deg)}}
    @keyframes alien-bob{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
    @keyframes star-pulse{0%,100%{opacity:.18}50%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){.ufo-hover,.alien-float,.star-twinkle{animation:none!important}}
  </style>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<g aria-hidden="true"><ellipse cx="955" cy="180" rx="290" ry="210" fill="url(#purpleNebula)"/><ellipse cx="1120" cy="35" rx="210" ry="130" fill="url(#purpleNebula)"/>
<g fill="#d5b3ff"><circle class="star-twinkle" cx="756" cy="44" r="2"/><circle cx="793" cy="22" r="1.5"/><circle class="star-twinkle" cx="948" cy="26" r="1.9"/><circle cx="1100" cy="160" r="2"/><circle cx="1144" cy="229" r="1.7"/><circle class="star-twinkle" cx="768" cy="291" r="2.2"/><circle cx="1130" cy="376" r="2"/><circle cx="992" cy="393" r="1.5"/><circle class="star-twinkle" cx="710" cy="391" r="1.9"/></g></g>
<g opacity=".22">
  <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200" stroke="#60a5fa" stroke-width=".7"/>
  <path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420" stroke="#60a5fa" stroke-width=".45"/>
</g>
<g transform="translate(90 60)">
  <rect x="0" y="0" width="640" height="300" rx="30" fill="url(#glass)" stroke="#60a5fa" stroke-opacity=".36" filter="url(#shadow)"/>
  <rect x="20" y="20" width="600" height="260" rx="22" fill="#04111f" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="54" cy="49" r="6" fill="#22d3ee"><animate attributeName="opacity" values=".35;1;.35" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="76" cy="49" r="6" fill="#8b5cf6"><animate attributeName="opacity" values="1;.35;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="98" cy="49" r="6" fill="#2563eb"/>
  <text x="42" y="105" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3">GAN-TECH // SYSTEM PROFILE</text>
  <text x="42" y="156" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="34">GEORGE ALFRED NYAMEMA</text>
  <text x="42" y="198" fill="url(#cyan)" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="22">Engineering · Data · AI · Automation</text>
  <text x="42" y="236" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="16">I build production systems that turn complexity into measurable outcomes.</text>
  <rect x="42" y="253" width="205" height="5" rx="2.5" fill="#0f2740"/>
  <rect x="42" y="253" width="120" height="5" rx="2.5" fill="url(#cyan)">
    <animate attributeName="width" values="80;205;120;205;80" dur="6s" repeatCount="indefinite"/>
  </rect>
</g>
<g transform="translate(870 210)" filter="url(#glow)">
  <ellipse rx="160" ry="62" fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="2" transform="rotate(-18)">
    <animateTransform attributeName="transform" type="rotate" values="-18;-378" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="126" ry="112" fill="none" stroke="#8b5cf6" stroke-opacity=".46" stroke-width="2" transform="rotate(38)">
    <animateTransform attributeName="transform" type="rotate" values="38;398" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <circle r="88" fill="url(#orb)" filter="url(#shadow)">
    <animate attributeName="r" values="84;90;84" dur="5s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="-25" cy="-32" rx="34" ry="18" fill="#fff" opacity=".28" transform="rotate(-28)"/>
  <circle cx="155" cy="-14" r="9" fill="#67e8f9">
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="-116" cy="-76" r="7" fill="#c4b5fd">
    <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="11s" repeatCount="indefinite"/>
  </circle>
</g>
<g font-family="ui-monospace,monospace" font-size="13" fill="#93c5fd">
  <text x="790" y="72">PYTHON</text><text x="1005" y="95">POSTGRESQL</text>
  <text x="1032" y="330">CLOUD</text><text x="760" y="350">LLM / ML</text>
</g>
<path d="M785 82C835 105 845 120 858 144M1011 105C977 126 954 140 935 155M1025 320C993 299 970 282 948 265M790 340C816 308 832 286 845 270" stroke="#38bdf8" stroke-opacity=".34" stroke-width="1.5" stroke-dasharray="5 8">
  <animate attributeName="stroke-dashoffset" values="0;-52" dur="4s" repeatCount="indefinite"/>
</path>
<g aria-label="Silver flying saucer hovering above the violet planet" transform="translate(801 79)"><g class="ufo-hover">
  <ellipse cx="0" cy="30" rx="42" ry="13" fill="url(#tractorBeam)" />
  <path d="M-22 7Q-16 -27 0 -27Q16 -27 22 7Z" fill="#63e7d8" stroke="#d9fdff" stroke-width="2" opacity=".94"/>
  <path d="M-13 -3Q0 -20 14 -3" fill="none" stroke="#eaffff" stroke-opacity=".7" stroke-width="3"/>
  <ellipse cy="11" rx="52" ry="17" fill="url(#ufoBody)" stroke="#d8c5ff" stroke-width="2"/>
  <ellipse cy="5" rx="43" ry="7" fill="#e3d8ff" opacity=".8"/>
  <g fill="#a3ffb4"><circle cx="-35" cy="13" r="3.5"/><circle cx="-17" cy="19" r="3.5"/><circle cx="0" cy="21" r="3.5"/><circle cx="17" cy="19" r="3.5"/><circle cx="35" cy="13" r="3.5"/></g>
  <path d="M-17 25L-42 94H42L17 25Z" fill="url(#tractorBeam)" opacity=".65"/>
  <ellipse cx="0" cy="30" rx="52" ry="8" fill="#a4ffbb" opacity=".16"/>
</g></g><g aria-label="Friendly green alien observing the purple solar system" transform="translate(1115 95)">
  <g class="alien-float">
    <ellipse cx="0" cy="5" rx="32" ry="39" fill="url(#alienSkin)" stroke="#c9ffc8" stroke-width="2"/>
    <path d="M-23 -18L-37 -46L-15 -34M23 -18L37 -46L15 -34" fill="none" stroke="#8afc89" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-13" cy="0" rx="11" ry="15" fill="#102636" transform="rotate(-18 -13 0)"/>
    <ellipse cx="13" cy="0" rx="11" ry="15" fill="#102636" transform="rotate(18 13 0)"/>
    <ellipse cx="-16" cy="-5" rx="3" ry="5" fill="#d2fffb" opacity=".9"/><ellipse cx="10" cy="-5" rx="3" ry="5" fill="#d2fffb" opacity=".9"/>
    <path d="M-9 21Q0 29 9 21" fill="none" stroke="#215d45" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-25" cy="18" rx="7" ry="4" fill="#ff92df" opacity=".35"/><ellipse cx="25" cy="18" rx="7" ry="4" fill="#ff92df" opacity=".35"/>
    <path d="M-18 39Q0 56 18 39L22 64H-22Z" fill="#713ac5" stroke="#ab88ed" stroke-width="2"/>
  </g>
</g>
<g aria-label="Small green alien navigator" transform="translate(1085 350) scale(.55)"><g class="alien-float"><ellipse rx="30" ry="37" fill="url(#alienSkin)"/><ellipse cx="-12" cy="-4" rx="9" ry="13" fill="#0a2434"/><ellipse cx="12" cy="-4" rx="9" ry="13" fill="#0a2434"/><path d="M-7 17Q0 23 7 17" fill="none" stroke="#20573a" stroke-width="3"/></g></g></svg>